# Pre-commit hooks 설정
# 커밋 전 자동으로 코드 품질을 검사하고 포맷팅을 수행합니다.

repos:
  # Python 코드 포맷팅
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        name: "🎨 Black (Python 포맷터)"
        language_version: python3.12
        args: [--line-length=88, --target-version=py312]
        exclude: ^(migrations/|venv/|\.venv/)

  # Import 정렬
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: "📦 isort (Import 정렬)"
        args: [--profile=black, --line-length=88, --multi-line=3]
        exclude: ^(migrations/|venv/|\.venv/)

  # 코드 린팅
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        name: "🔍 Flake8 (린팅)"
        args: [
          --max-line-length=88,
          --extend-ignore=E203,W503,E501,
          --exclude=migrations,venv,.venv,
          --max-complexity=10
        ]
        additional_dependencies: [
          flake8-docstrings,
          flake8-bugbear,
          flake8-comprehensions,
          flake8-simplify
        ]

  # 타입 체킹
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        name: "🏷️ MyPy (타입 체킹)"
        args: [--ignore-missing-imports, --no-strict-optional]
        additional_dependencies: [
          types-requests,
          types-redis,
          types-python-dateutil
        ]
        exclude: ^(tests/|migrations/|venv/|\.venv/)

  # 보안 취약점 검사
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        name: "🛡️ Bandit (보안 검사)"
        args: [-r, ., -f, json, -o, bandit-report.json]
        exclude: ^(tests/|venv/|\.venv/)

  # 일반적인 코드 품질 검사
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # 파일 끝 공백 제거
      - id: trailing-whitespace
        name: "✂️ 파일 끝 공백 제거"
        exclude: ^(\.md$|\.txt$)

      # 파일 끝 개행 확인
      - id: end-of-file-fixer
        name: "📄 파일 끝 개행 확인"

      # 대용량 파일 체크
      - id: check-added-large-files
        name: "📏 대용량 파일 체크"
        args: [--maxkb=1000]

      # JSON 문법 검사
      - id: check-json
        name: "📋 JSON 문법 검사"

      # YAML 문법 검사
      - id: check-yaml
        name: "📋 YAML 문법 검사"
        args: [--allow-multiple-documents]

      # XML 문법 검사
      - id: check-xml
        name: "📋 XML 문법 검사"

      # TOML 문법 검사
      - id: check-toml
        name: "📋 TOML 문법 검사"

      # Merge conflict 표시 체크
      - id: check-merge-conflict
        name: "🔀 Merge conflict 체크"

      # Case conflict 체크 (대소문자)
      - id: check-case-conflict
        name: "🔤 파일명 대소문자 충돌 체크"

      # 디버그 구문 체크
      - id: debug-statements
        name: "🐛 디버그 구문 체크"

      # 개인정보 체크 (기본)
      - id: detect-private-key
        name: "🔐 개인키 노출 체크"

  # Docstring 검사
  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        name: "📝 Pydocstyle (Docstring 검사)"
        args: [--convention=google, --add-ignore=D100,D101,D102,D103,D104,D105]
        exclude: ^(tests/|migrations/|venv/|\.venv/)

  # Jupyter Notebook 정리
  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.7.1
    hooks:
      - id: nbqa-black
        name: "📓 Jupyter Notebook 포맷팅"
        args: [--line-length=88]
      - id: nbqa-isort
        name: "📓 Jupyter Notebook Import 정렬"
        args: [--profile=black]

  # 환경변수 및 비밀정보 검사
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        name: "🕵️ 비밀정보 노출 검사"
        args: [
          --baseline, .secrets.baseline,
          --exclude-files, '.*\.env.*',
          --exclude-files, '.*\.key$',
          --exclude-files, '.*\.pem$'
        ]

  # 커밋 메시지 검사
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.13.0
    hooks:
      - id: commitizen
        name: "💬 커밋 메시지 검사"
        stages: [commit-msg]

# Pre-commit 설정
default_stages: [commit]
fail_fast: false

# CI에서 실행할 추가 훅
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
